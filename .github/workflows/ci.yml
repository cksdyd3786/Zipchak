name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  schema:
    name: 스키마·fixture 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: packages/schema
      - run: npm run validate
        working-directory: packages/schema
      - name: .github 스크립트 테스트 (리뷰어 지정·공통 경로 승인)
        run: node --test .github/scripts/*.test.js

  schema-windows:
    name: 스키마 검증 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: packages/schema
      - run: npm run validate
        working-directory: packages/schema

  ios:
    name: iOS 테스트·빌드
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 버전
        run: xcodebuild -version
      - name: ZipChakCore 단위 테스트 (swift test)
        working-directory: apps/ios/ZipChakCore
        run: swift test
      - name: ZipChakScan 시뮬레이터 빌드 (서명 없이)
        run: >
          xcodebuild
          -project apps/ios/ZipChakScan.xcodeproj
          -scheme ZipChakScan
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  engine:
    name: 엔진 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: services/engine
      - run: pytest -q
        working-directory: services/engine

  api:
    name: API 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # job 은 항상 돌고 단계만 건너뛴다 (web job 과 같은 방식 — 필수 검사로 걸어도 "대기 중"으로 막히지 않음)
      - name: 변경 경로 확인 (services/api, packages/schema)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(services/api/|packages/schema/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: steps.changes.outputs.run == 'true'
        working-directory: services/api
      - run: npm test
        if: steps.changes.outputs.run == 'true'
        working-directory: services/api
      - run: npm run build
        if: steps.changes.outputs.run == 'true'
        working-directory: services/api
      - run: echo "services/api·packages/schema 변경이 없어 건너뜁니다"
        if: steps.changes.outputs.run != 'true'

  web:
    name: 웹 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund && npm run build
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        working-directory: apps/web
      - run: echo "apps/web 프로젝트가 아직 없어 건너뜁니다 (B가 1주차에 생성)"
        if: ${{ hashFiles('apps/web/package.json') == '' }}
