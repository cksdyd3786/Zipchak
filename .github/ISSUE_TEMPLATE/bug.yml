name: 버그
description: 동작이 완료 기준과 다를 때
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: feature_id
    attributes:
      label: 관련 기능 ID
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 기기·브라우저, 사용한 방(fixture 이름 또는 roomId) 포함
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작 / 실제 동작
    validations:
      required: true
