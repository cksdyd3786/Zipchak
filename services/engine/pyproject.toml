[project]
name = "zipchak-engine"
version = "0.1.0"
description = "집착 AI 배치·마켓 추천 엔진 (담당 D)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "shapely>=2.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "datamodel-code-generator>=0.25"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
